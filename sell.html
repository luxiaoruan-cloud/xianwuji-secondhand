<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布闲置 - 闲物集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B35',
            secondary: '#2EC4B6',
            dark: '#1A1A2E',
            light: '#F8F9FA',
            soft: '#FFF5F0'
          },
          fontFamily: {
            sans: ['\"Noto Sans SC\"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light font-sans text-dark antialiased">
  <!-- 顶部导航 -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-orange-400 flex items-center justify-center text-white shadow-md">
            <i class="fas fa-recycle text-lg"></i>
          </div>
          <span class="text-xl font-bold">闲物集</span>
        </a>
        <a href="index.html" class="text-sm text-gray-500 hover:text-primary transition">
          <i class="fas fa-arrow-left mr-1"></i> 返回首页
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8 pb-24">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold mb-2">发布闲置好物</h1>
      <p class="text-gray-500 text-sm">填写信息，让它找到新主人</p>
    </div>

    <form id="sellForm" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-6">
      <!-- 图片上传区 (模拟) -->
      <div>
        <label class="block text-sm font-medium mb-2">商品图片</label>
        <div id="imageUpload" class="border-2 border-dashed border-gray-200 rounded-2xl p-8 text-center hover:border-primary hover:bg-soft/50 transition cursor-pointer">
          <div class="text-4xl mb-3">📷</div>
          <p class="text-gray-600 font-medium">点击上传图片</p>
          <p class="text-gray-400 text-xs mt-1">最多 6 张，支持 JPG/PNG</p>
          <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
        </div>
        <div id="previewImages" class="grid grid-cols-3 gap-3 mt-3"></div>
      </div>

      <!-- 标题 -->
      <div>
        <label class="block text-sm font-medium mb-2">标题 <span class="text-primary">*</span></label>
        <input type="text" id="title" required maxlength="50" placeholder="简洁描述你的闲置，如：几乎全新 iPhone 13 128G"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
      </div>

      <!-- 分类 & 成色 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-2">分类 <span class="text-primary">*</span></label>
          <select id="category" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition bg-white">
            <option value="">选择分类</option>
            <option value="数码">数码</option>
            <option value="家电">家电</option>
            <option value="服饰">服饰</option>
            <option value="图书">图书</option>
            <option value="家具">家具</option>
            <option value="运动">运动</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">成色 <span class="text-primary">*</span></label>
          <select id="condition" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition bg-white">
            <option value="">选择成色</option>
            <option value="全新">全新</option>
            <option value="几乎全新">几乎全新</option>
            <option value="轻微使用">轻微使用</option>
            <option value="明显使用痕迹">明显使用痕迹</option>
          </select>
        </div>
      </div>

      <!-- 价格 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-2">售价 (¥) <span class="text-primary">*</span></label>
          <input type="number" id="price" required min="1" placeholder="0"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">原价 (¥)</label>
          <input type="number" id="originalPrice" min="0" placeholder="选填"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
        </div>
      </div>

      <!-- 描述 -->
      <div>
        <label class="block text-sm font-medium mb-2">详细描述</label>
        <textarea id="description" rows="4" maxlength="500" placeholder="说说物品的故事、使用情况、转手原因..."
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition resize-none"></textarea>
      </div>

      <!-- 地点 -->
      <div>
        <label class="block text-sm font-medium mb-2">所在城市</label>
        <input type="text" id="location" placeholder="如：上海 · 徐汇" 
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
      </div>

      <!-- 提交 -->
      <button type="submit" class="w-full bg-primary hover:bg-orange-600 text-white py-3.5 rounded-full font-medium text-lg shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
        <i class="fas fa-paper-plane"></i>
        立即发布
      </button>
    </form>

    <!-- 成功提示 -->
    <div id="successToast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-dark text-white px-6 py-3 rounded-full shadow-xl hidden items-center gap-2 z-50">
      <i class="fas fa-check-circle text-secondary"></i>
      <span>发布成功！已添加到首页</span>
    </div>
  </main>

  <!-- 移动端底部导航 -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 z-40">
    <div class="flex justify-around py-2">
      <a href="index.html" class="flex flex-col items-center gap-1 text-gray-500 px-4 py-1">
        <i class="fas fa-home text-lg"></i>
        <span class="text-xs">首页</span>
      </a>
      <a href="sell.html" class="flex flex-col items-center gap-1 text-primary px-4 py-1">
        <i class="fas fa-plus-circle text-lg"></i>
        <span class="text-xs">发布</span>
      </a>
      <a href="index.html" class="flex flex-col items-center gap-1 text-gray-500 px-4 py-1">
        <i class="fas fa-shopping-bag text-lg"></i>
        <span class="text-xs">想要</span>
      </a>
    </div>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/sell.js"></script>
</body>
</html>
